name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a mutable tag can be repointed at
      # attacker code that would then run inside this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags needed by the installer ref-resolution test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Catches a broken release before it ships: missing frontmatter,
      # missing references, or links in SKILL.md pointing at deleted files.
      - name: Verify skill payload
        run: node bin/cli.js verify

      - name: Check manifests parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      # The three plugin manifests are published together, so they must agree.
      # SKILL.md carries its own content version and is deliberately excluded.
      - name: Check versions agree
        run: |
          node -e "
            const fs = require('fs');
            const read = p => JSON.parse(fs.readFileSync(p, 'utf8')).version;
            const versions = {
              'package.json': read('package.json'),
              'plugin.json': read('plugin.json'),
              '.claude-plugin/plugin.json': read('.claude-plugin/plugin.json'),
            };
            if (new Set(Object.values(versions)).size !== 1) {
              console.error('Version mismatch:', versions);
              process.exit(1);
            }
            console.log('Versions agree:', versions);
          "

      # A stale pin would silently ship the previous release to every curl
      # user, so the pin is enforced rather than trusted to a checklist.
      - name: Check install.sh pin matches the release
        run: |
          node -e "
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const pin = fs.readFileSync('install.sh', 'utf8').match(/^PINNED_REF=\"([^\"]+)\"/m)?.[1];
            if (pin !== 'v' + version) {
              console.error(\`install.sh PINNED_REF is \${pin}, expected v\${version}\`);
              process.exit(1);
            }
            console.log('install.sh pinned to', pin);
          "

      # Corpus integrity only. Scoring detection quality needs a real agent
      # run over the fixtures — see tests/README.md.
      - name: Validate benchmark corpus
        run: node tests/run.js validate

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Smoke-test install
        run: |
          node bin/cli.js install --dir "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/secure-me/SKILL.md"
          test -d "$RUNNER_TEMP/skills/secure-me/references"
          node bin/cli.js uninstall --dir "$RUNNER_TEMP/skills"

      # codeload resolves branches and SHAs from the bare path but 404s there
      # for an annotated tag, which silently broke every pinned curl install.
      # Both forms are exercised so that cannot regress.
      - name: Smoke-test curl installer ref resolution
        run: |
          SECURE_ME_REF="$GITHUB_SHA" SECURE_ME_DIR="$RUNNER_TEMP/by-sha" bash install.sh
          test -f "$RUNNER_TEMP/by-sha/secure-me/SKILL.md"

          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            SECURE_ME_REF="$tag" SECURE_ME_DIR="$RUNNER_TEMP/by-tag" bash install.sh
            test -f "$RUNNER_TEMP/by-tag/secure-me/SKILL.md"
            echo "Verified tag ref: $tag"
          else
            echo "No tag exists yet; refs/tags path not exercised"
          fi
