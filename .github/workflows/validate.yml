name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Catches a broken release before it ships: missing frontmatter,
      # missing references, or links in SKILL.md pointing at deleted files.
      - name: Verify skill payload
        run: node bin/cli.js verify

      - name: Check manifests parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      # The three plugin manifests are published together, so they must agree.
      # SKILL.md carries its own content version and is deliberately excluded.
      - name: Check versions agree
        run: |
          node -e "
            const fs = require('fs');
            const read = p => JSON.parse(fs.readFileSync(p, 'utf8')).version;
            const versions = {
              'package.json': read('package.json'),
              'plugin.json': read('plugin.json'),
              '.claude-plugin/plugin.json': read('.claude-plugin/plugin.json'),
            };
            if (new Set(Object.values(versions)).size !== 1) {
              console.error('Version mismatch:', versions);
              process.exit(1);
            }
            console.log('Versions agree:', versions);
          "

      - name: Lint install.sh
        run: shellcheck install.sh

      - name: Smoke-test install
        run: |
          node bin/cli.js install --dir "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/secure-me/SKILL.md"
          test -d "$RUNNER_TEMP/skills/secure-me/references"
          node bin/cli.js uninstall --dir "$RUNNER_TEMP/skills"
